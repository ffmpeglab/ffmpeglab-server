# webhook.yaml
name: "Webhook Example"
pipelineId: "video-transcode"
runId:
  mode: "deterministic"
  template: "{baseFilename}"
description: "Generate thumbnails & send webhook status"
version: "1.0.0"

webhook:
  url: "https://api.ffmpeglab.com/"
  method: "POST"
  headers:
    Authorization: "Bearer YOUR_TOKEN"
  payload: |
    {
      "event": "pipeline_complete",
      "renderId": "{{renderId}}",
      "status": "{{status}}",
      "project": "{{project}}",
      "userId": "{{userId}}",
      "filePath": "{{filePath}}",
      "completedAt": "{{completedAt}}"
    }

storage:
  output_bucket: "processed"
  buckets:
    - name: "webhook-uploads"
      public: false
      allowed_mime_types: ["video/mp4"]
    - name: "webhook-processed"
      public: true
      allowed_mime_types: ["image/jpeg"]

  rls_policies:
    - name: "Users can upload to their own folder"
      operation: "INSERT"
      role: "authenticated"
      condition: |
        bucket_id = 'uploads' AND
        (storage.foldername(name))[1] = auth.uid()::text

steps:
  - id: "thumbnail"
    trigger:
      name: "handle_thumbnail"
      event: "INSERT"
      table: "storage.objects"
      condition: |
        NEW.bucket_id = 'uploads'
    command: -i $MEDIA_1 -vf thumbnail,scale=320:180 -frames:v 1 -f image2 -y $OUTPUT_PATH
    inputs: ["INPUT_FILE"]
    outputs: ["OUTPUT_FILE"]
    output_path: "{{userId}}/thumbnails/{{baseFilename}}.jpg"
    editor:
      output: "jpg"
      preset: "fast"
      selectedCode: "custom"
    keep: true

render:
  project_name: "video-transcode"
  status: "queued"
  public: false