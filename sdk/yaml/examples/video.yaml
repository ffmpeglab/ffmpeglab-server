# video-pipeline.yaml
name: "Ultimate Video Onboarding Pipeline"
pipelineId: "video-pipeline"
runId:
  mode: "deterministic"   # "random" (default) or "deterministic"
  template: "{baseFilename}"   # human‑readable run ID
description: "Parallel video & image processing: thumbnails, transcodes, all artifacts kept"
version: "1.0.0"

# Global editor defaults (applied to all steps unless overridden)
editor:
  compressionLevel: 23
  preset: "medium"
  aspectRatio: "16:9"
  framerate: 30
  opacity: 1.0
  output: "mp4"

storage:
  output_bucket: "video-processed"
  buckets:
    - name: "video-uploads"
      public: false
      allowed_mime_types:
        - "video/mp4"
        - "video/quicktime"
        - "video/webm"
        - "image/jpeg"
        - "image/png"
        - "image/webp"
        - "image/gif"
    - name: "video-processed"
      public: true
      allowed_mime_types:
        - "image/jpeg"
        - "image/png"
        - "video/mp4"

  rls_policies:
    - name: "Users can upload to their own video folder"
      operation: "INSERT"
      role: "authenticated"
      condition: |
        bucket_id = 'video-uploads' AND
        (storage.foldername(name))[1] = auth.uid()::text

    - name: "Users can read their own processed video"
      operation: "SELECT"
      role: "authenticated"
      condition: |
        bucket_id = 'video-processed' AND
        (storage.foldername(name))[1] = auth.uid()::text

    - name: "Public read access to processed video"
      operation: "SELECT"
      role: "anon"
      condition: |
        bucket_id = 'video-processed'

    - name: "Service role can manage processed video"
      operation: "ALL"
      role: "service_role"
      condition: |
        bucket_id = 'video-processed'

steps:
  # ---- Video thumbnails ----
  - id: "thumbnail_160x90"
    trigger:
      name: "handle_thumbnail_160x90"
      event: "INSERT"
      table: "storage.objects"
      condition: |
        NEW.bucket_id = 'video-uploads' AND
        NEW.name NOT LIKE '%.emptyFolderPlaceholder' AND
        (NEW.metadata->>'mimetype' LIKE 'video/%')
    command: -i $MEDIA_1 -vf thumbnail,scale=160:90 -frames:v 1 -f image2 -y $OUTPUT_PATH
    inputs: ["INPUT_FILE"]
    outputs: ["OUTPUT_FILE"]
    output_path: "{{userId}}/{{pipelineId}}/{{runId}}/thumbnails/160x90.jpg"
    editor:
      output: "jpg"
      preset: "fast"
      selectedCode: "custom"
      width: 160
      height: 90
    keep: true

  - id: "thumbnail_320x180"
    trigger:
      name: "handle_thumbnail_320x180"
      event: "INSERT"
      table: "storage.objects"
      condition: |
        NEW.bucket_id = 'video-uploads' AND
        NEW.name NOT LIKE '%.emptyFolderPlaceholder' AND
        (NEW.metadata->>'mimetype' LIKE 'video/%')
    command: -i $MEDIA_1 -vf thumbnail,scale=320:180 -frames:v 1 -f image2 -y $OUTPUT_PATH
    inputs: ["INPUT_FILE"]
    outputs: ["OUTPUT_FILE"]
    output_path: "{{userId}}/{{pipelineId}}/{{runId}}/thumbnails/320x180.jpg"
    editor:
      output: "jpg"
      preset: "fast"
      selectedCode: "custom"
      width: 320
      height: 180
    keep: true

  - id: "thumbnail_640x360"
    trigger:
      name: "handle_thumbnail_640x360"
      event: "INSERT"
      table: "storage.objects"
      condition: |
        NEW.bucket_id = 'video-uploads' AND
        NEW.name NOT LIKE '%.emptyFolderPlaceholder' AND
        (NEW.metadata->>'mimetype' LIKE 'video/%')
    command: -i $MEDIA_1 -vf thumbnail,scale=640:360 -frames:v 1 -f image2 -y $OUTPUT_PATH
    inputs: ["INPUT_FILE"]
    outputs: ["OUTPUT_FILE"]
    output_path: "{{userId}}/{{pipelineId}}/{{runId}}/thumbnails/640x360.jpg"
    editor:
      output: "jpg"
      preset: "fast"
      selectedCode: "custom"
      width: 640
      height: 360
    keep: true

  # ---- Video transcodes ----
  - id: "transcode_480p"
    trigger:
      name: "handle_transcode_480p"
      event: "INSERT"
      table: "storage.objects"
      condition: |
        NEW.bucket_id = 'video-uploads' AND
        NEW.name NOT LIKE '%.emptyFolderPlaceholder' AND
        (NEW.metadata->>'mimetype' LIKE 'video/%')
    command: -i $MEDIA_1 -c:v libx264 -crf 23 -preset medium -vf scale=-2:480 -c:a aac -b:a 128k -movflags +faststart -f mp4 -y $OUTPUT_PATH
    inputs: ["INPUT_FILE"]
    outputs: ["OUTPUT_FILE"]
    output_path: "{{userId}}/{{pipelineId}}/{{runId}}/videos/480p.mp4"
    editor:
      output: "mp4"
      preset: "medium"
      selectedCode: "custom"
      width: 854
      height: 480
      compressionLevel: 23
    keep: true

  - id: "transcode_720p"
    trigger:
      name: "handle_transcode_720p"
      event: "INSERT"
      table: "storage.objects"
      condition: |
        NEW.bucket_id = 'video-uploads' AND
        NEW.name NOT LIKE '%.emptyFolderPlaceholder' AND
        (NEW.metadata->>'mimetype' LIKE 'video/%')
    command: -i $MEDIA_1 -c:v libx264 -crf 23 -preset medium -vf scale=-2:720 -c:a aac -b:a 128k -movflags +faststart -f mp4 -y $OUTPUT_PATH
    inputs: ["INPUT_FILE"]
    outputs: ["OUTPUT_FILE"]
    output_path: "{{userId}}/{{pipelineId}}/{{runId}}/videos/720p.mp4"
    editor:
      output: "mp4"
      preset: "medium"
      selectedCode: "custom"
      width: 1280
      height: 720
      compressionLevel: 23
    keep: true

  - id: "transcode_1080p"
    trigger:
      name: "handle_transcode_1080p"
      event: "INSERT"
      table: "storage.objects"
      condition: |
        NEW.bucket_id = 'video-uploads' AND
        NEW.name NOT LIKE '%.emptyFolderPlaceholder' AND
        (NEW.metadata->>'mimetype' LIKE 'video/%')
    command: -i $MEDIA_1 -c:v libx264 -crf 23 -preset medium -vf scale=-2:1080 -c:a aac -b:a 128k -movflags +faststart -f mp4 -y $OUTPUT_PATH
    inputs: ["INPUT_FILE"]
    outputs: ["OUTPUT_FILE"]
    output_path: "{{userId}}/{{pipelineId}}/{{runId}}/videos/1080p.mp4"
    editor:
      output: "mp4"
      preset: "medium"
      selectedCode: "custom"
      width: 1920
      height: 1080
      compressionLevel: 23
    keep: true

  # ---- Image thumbnail ----
  - id: "image_thumbnail_320x320"
    trigger:
      name: "handle_image_thumbnail"
      event: "INSERT"
      table: "storage.objects"
      condition: |
        NEW.bucket_id = 'video-uploads' AND
        NEW.name NOT LIKE '%.emptyFolderPlaceholder' AND
        (NEW.metadata->>'mimetype' LIKE 'image/%')
    command: -i $MEDIA_1 -vf scale=320:320:force_original_aspect_ratio=decrease,pad=320:320:(ow-iw)/2:(oh-ih)/2 -q:v 85 -f image2 -y $OUTPUT_PATH
    inputs: ["INPUT_FILE"]
    outputs: ["OUTPUT_FILE"]
    output_path: "{{userId}}/{{pipelineId}}/{{runId}}/thumbnails/320x320.jpg"
    editor:
      output: "jpg"
      preset: "fast"
      selectedCode: "custom"
      width: 320
      height: 320
    keep: true

render:
  project_name: "video-processing"
  status: "queued"
  public: false