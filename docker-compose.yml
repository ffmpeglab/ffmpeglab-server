networks:
  isolated:
    internal: true   # No external connectivity
  public:   # Standard bridge network, created by Compose on docker compose up
services:
  api:
    image: ffmpeglab/server:main
    ports:
      - "3000:3000"
    environment:
      - DB_HOST=${DB_HOST}
      - DB_USER=${DB_USER}
      - DB_PORT=${DB_PORT}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME}
      - QUEUE_DB_HOST=${QUEUE_DB_HOST}
      - QUEUE_DB_USER=${QUEUE_DB_USER}
      - QUEUE_DB_PORT=${QUEUE_DB_PORT}
      - QUEUE_DB_PASSWORD=${QUEUE_DB_PASSWORD}
      - QUEUE_DB_NAME=${QUEUE_DB_NAME}
      - DB_MIGRATION_ENABLED=${DB_MIGRATION_ENABLED}
    networks:
      - isolated
      - public
  render-runner:
    depends_on:
      - api
    image: ffmpeglab/server:main
    volumes:
      - ./tmp:/tmp/ffmpeglab
    environment:
      - DB_HOST=${DB_HOST}
      - DB_USER=${DB_USER}
      - DB_PORT=${DB_PORT}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME}
      - QUEUE_DB_HOST=${QUEUE_DB_HOST}
      - QUEUE_DB_USER=${QUEUE_DB_USER}
      - QUEUE_DB_PORT=${QUEUE_DB_PORT}
      - QUEUE_DB_PASSWORD=${QUEUE_DB_PASSWORD}
      - QUEUE_DB_NAME=${QUEUE_DB_NAME}
      - IS_RENDER_RUNNER=true
    networks:
      - isolated
      - public
  file-runner:
    depends_on:
      - api
    image: ffmpeglab/server:main
    volumes:
      - ./tmp:/tmp/ffmpeglab
    environment:
      - DB_HOST=${DB_HOST}
      - DB_USER=${DB_USER}
      - DB_PORT=${DB_PORT}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME}
      - QUEUE_DB_HOST=${QUEUE_DB_HOST}
      - QUEUE_DB_USER=${QUEUE_DB_USER}
      - QUEUE_DB_PORT=${QUEUE_DB_PORT}
      - QUEUE_DB_PASSWORD=${QUEUE_DB_PASSWORD}
      - QUEUE_DB_NAME=${QUEUE_DB_NAME}
      - S3_ACCESS_KEY=${S3_ACCESS_KEY}
      - S3_SECRET_KEY=${S3_SECRET_KEY}
      - S3_REGION=${S3_REGION}
      - S3_ENDPOINT=${S3_ENDPOINT}
      - IS_FILE_RUNNER=true
    networks:
      - isolated
      - public
  logs-runner:
    depends_on:
      - api
    image: ffmpeglab/server:main
    environment:
      - DB_HOST=${DB_HOST}
      - DB_USER=${DB_USER}
      - DB_PORT=${DB_PORT}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME}
      - QUEUE_DB_HOST=${QUEUE_DB_HOST}
      - QUEUE_DB_USER=${QUEUE_DB_USER}
      - QUEUE_DB_PORT=${QUEUE_DB_PORT}
      - QUEUE_DB_PASSWORD=${QUEUE_DB_PASSWORD}
      - QUEUE_DB_NAME=${QUEUE_DB_NAME}
      - IS_LOGS_RUNNER=true
    networks:
      - isolated
      - public